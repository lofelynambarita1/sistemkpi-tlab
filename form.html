<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah User — Sistem KPI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sip-sidebar':     '#7F1D1D',
                        'sip-sidebar-sec': '#991B1B',
                        'sip-sidebar-act': '#B91C1C',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-gray-50">
    <div id="topbar-container"></div>
    <div id="sidebar-container"></div>

    <main class="page-main">
        <nav class="mb-4 text-sm">
            <ol class="flex text-gray-500 gap-2">
                <li><a href="../../index.html" class="text-red-700 hover:underline">Home</a></li>
                <li>/</li>
                <li><a href="list.html" class="text-red-700 hover:underline">Manajemen User</a></li>
                <li>/</li>
                <li class="text-gray-700">Tambah User</li>
            </ol>
        </nav>

        <header class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Tambah User</h1>
            <p class="text-gray-600">Pendaftaran akun karyawan baru</p>
        </header>

        <div class="bg-white rounded-lg shadow p-6">
            <form id="user-form">
                <div class="mb-4">
                    <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap <span class="text-red-500">*</span></label>
                    <input type="text" id="nama" name="nama" required maxlength="255"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700"
                           placeholder="Rian Pratama">
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
                    <input type="email" id="email" name="email" required maxlength="255"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700"
                           placeholder="rian.associate@company.com">
                </div>
                <div class="mb-4">
                    <label for="jabatan" class="block text-sm font-medium text-gray-700 mb-1">Jabatan <span class="text-red-500">*</span></label>
                    <input type="text" id="jabatan" name="jabatan" required maxlength="100"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700"
                           placeholder="Software Engineer">
                </div>
                <div class="mb-4">
                    <label for="divisi" class="block text-sm font-medium text-gray-700 mb-1">Divisi <span class="text-red-500">*</span></label>
                    <input type="text" id="divisi" name="divisi" required maxlength="100"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700"
                           placeholder="Engineering">
                </div>
                <div class="mb-4">
                    <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role <span class="text-red-500">*</span></label>
                    <select id="role" name="role" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700">
                        <option value="">-- Pilih Role --</option>
                        <option value="Associate">Associate</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Senior">Senior</option>
                        <option value="Lead">Lead</option>
                        <option value="Principle">Principle</option>
                        <option value="Lead HR">Lead HR</option>
                        <option value="Manager">Manager</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="atasan" class="block text-sm font-medium text-gray-700 mb-1">Atasan</label>
                    <select id="atasan" name="atasan" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700">
                        <option value="">-- Tanpa Atasan (untuk Manager/Admin) --</option>
                        <option value="5">Budi Santosa (Lead)</option>
                        <option value="6">Maya Putri (Lead HR)</option>
                        <option value="7">Hendra Kusuma (Manager)</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
                    <input type="password" id="password" name="password" required minlength="8" maxlength="255"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700"
                           placeholder="Minimal 8 karakter">
                </div>
                <div class="mb-4">
                    <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Status Akun</label>
                    <select id="status" name="status" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700">
                        <option value="Aktif" selected>Aktif</option>
                        <option value="Nonaktif">Nonaktif</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 mt-6 pt-4 border-t">
                    <button type="button" onclick="history.back()" class="btn-secondary">Batal</button>
                    <button type="submit" class="btn-primary">Simpan</button>
                </div>
            </form>
        </div>
    </main>

    <script src="../../js/sidebar-component.js"></script>
    <script>
        checkSession(); initSidebar('users-form');
        document.getElementById('user-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('User berhasil ditambahkan!');
            window.location.href = 'list.html';
        });
    </script>
</body>
</html>
